<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="LoveCloud progressive web app for splash, onboarding, and authentication.">
  <meta name="theme-color" content="#FF4458">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LoveCloud">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LoveCloud</title>
  <link rel="manifest" href="manifest.json">

  <!-- Version Check & Smart Cache Eviction Script (Preserves User Data / Login) -->
  <script>
    (async function() {
      const STORAGE_KEY = '_lovecloud_active_version';
      try {
        const res = await fetch('version.json?_t=' + Date.now(), {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
        });
        if (res.ok) {
          const data = await res.json();
          const serverVer = data.build || data.version;
          const localVer = localStorage.getItem(STORAGE_KEY);

          if (localVer && serverVer && localVer !== serverVer) {
            console.log('[LoveCloud] New version detected:', serverVer, '(previous:', localVer + ')');
            // Purge only CacheStorage (JS, WASM, assets). NEVER touch localStorage or IndexedDB!
            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(keys.map(k => caches.delete(k)));
            }
            if ('serviceWorker' in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              for (const reg of registrations) {
                await reg.update();
              }
            }
            localStorage.setItem(STORAGE_KEY, serverVer);
            window.location.reload();
            return;
          } else if (serverVer) {
            localStorage.setItem(STORAGE_KEY, serverVer);
          }
        }
      } catch (e) {
        console.warn('[LoveCloud] Version check skipped:', e);
      }
    })();
  </script>
</head>
<body>
  <!-- Agora WebRTC SDK & Calling Bridge -->
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
  <script src="agora_web_helper.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
