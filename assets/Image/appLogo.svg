<svg width="480" height="130" viewBox="0 0 480 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E74" />
      <stop offset="100%" stop-color="#FF334B" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF758C" />
      <stop offset="100%" stop-color="#FF4458" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#FF4458" flood-opacity="0.30"/>
    </filter>
  </defs>
  
  <!-- Romantic Cloud + Heart Emblem -->
  <g filter="url(#glow)">
    <!-- Cloud base -->
    <path d="M45 94 C26 94 12 81 12 64 C12 48 25 36 41 36 C43 36 46 36.5 48 37 C54 21 69 11 87 11 C107 11 123 24 126 43 C130 42 134 41.5 138 41.5 C155 41.5 169 55 169 72 C169 89 155 94 138 94 Z" fill="url(#cloudGrad)"/>
    
    <!-- Inner White Heart Cutout -->
    <path d="M87 40 C80 31 67 31 60 40 C52 50 52 62 63 74 L87 92 L111 74 C122 62 122 50 114 40 C107 31 94 31 87 40 Z" fill="#FFFFFF"/>
    
    <!-- Center Rose Heart -->
    <path d="M87 47 C82 39 71 39 65 47 C58 55 59 65 68 75 L87 89 L106 75 C115 65 116 55 109 47 C103 39 92 39 87 47 Z" fill="url(#heartGrad)"/>
  </g>

  <!-- LoveCloud Typography in Signature Flame Rose -->
  <text x="185" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="#FF4458" letter-spacing="-0.5">Love<tspan font-weight="800" fill="#FF5E74">Cloud</tspan></text>
  <text x="188" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#9E9AA8" letter-spacing="3.5">INFINITE MATCH</text>
</svg>
