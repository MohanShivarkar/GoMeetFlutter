<svg width="480" height="130" viewBox="0 0 480 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Option 1 Sunset Blush & Flame Rose Gradient -->
    <linearGradient id="roseGradient" x1="10" y1="10" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4458"/>
      <stop offset="60%" stop-color="#FF758C"/>
      <stop offset="100%" stop-color="#FFA07A"/>
    </linearGradient>
    <filter id="softGlow" x="0" y="0" width="130" height="130" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#FF4458" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Glowing Option 1 Squircle Badge -->
  <g filter="url(#softGlow)">
    <rect x="15" y="15" width="100" height="100" rx="28" fill="url(#roseGradient)"/>
  </g>

  <!-- Stylized Cloud + Twin Hearts Emblem (Pure Vector) -->
  <!-- Cloud Body Base -->
  <path d="M42 75 C37 75 33 71 33 66 C33 61 37 57 42 57 C43 51 48 46 55 46 C60 46 65 49 67 54 C70 50 75 48 81 48 C89 48 95 54 95 62 C99 63 102 67 102 71 C102 76 98 80 93 80 L42 80 Z" fill="white" fill-opacity="0.25"/>

  <!-- Crisp Central Heart -->
  <path d="M65 82 C65 82 45 68 45 54 C45 45 52 38 60 38 C64 38 67 40 65 44 C67 40 71 38 75 38 C83 38 90 45 90 54 C90 68 65 82 65 82 Z" fill="white"/>

  <!-- LoveCloud Typography in Signature Flame Rose & Sunset Coral -->
  <text x="138" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" fill="#FF4458" letter-spacing="-0.5">Love<tspan font-weight="800" fill="#FF758C">Cloud</tspan></text>
  <text x="142" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#9E9AA8" letter-spacing="4">INFINITE MATCH</text>
</svg>